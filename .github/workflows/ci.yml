name: CI

on:
  push:
    branches: [master, npm-package]
  pull_request:

jobs:
  verify:
    name: reproduce core + fidelity gate + sync smoke
    runs-on: ubuntu-latest
    env:
      # Pin to the emcc that built the committed dist/ (see dist/engine/cores/PROVENANCE.json).
      EMSDK_VERSION: 6.0.1
    steps:
      - uses: actions/checkout@v6

      - name: Cache emsdk + vendored core source
        uses: actions/cache@v5
        with:
          path: |
            emsdk
            vendor
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('build.sh') }}

      - name: Build the wasm core from source
        run: ./build.sh

      - name: "Reproducibility gate: rebuild is functionally identical to committed dist/engine"
        # emcc 6.0.1 is NOT bit-reproducible across hosts (verified 2026-07-27: local
        # and GH-runner rebuilds from identical pinned inputs differ from each other
        # at the same structural byte, a stack/global initializer). So the gate is
        # functional, not bitwise: the JS glue (exports/ABI) must match byte-for-byte
        # (it IS deterministic), app.js must match, wasm size must be within 1%, and
        # BOTH cores must land the differential gate's WRAM CRC (next step).
        run: |
          set -euo pipefail
          cmp web/cores/bsnes_jg.js dist/engine/cores/bsnes_jg.js
          cmp web/app.js            dist/engine/app.js
          BUILT=$(stat -c%s web/cores/bsnes_jg.wasm); SHIPPED=$(stat -c%s dist/engine/cores/bsnes_jg.wasm)
          DELTA=$(( BUILT > SHIPPED ? BUILT - SHIPPED : SHIPPED - BUILT ))
          [ $(( DELTA * 100 )) -le "$SHIPPED" ] || { echo "wasm size drift >1%: built $BUILT vs shipped $SHIPPED"; exit 1; }
          echo "glue+app.js byte-identical; wasm size delta ${DELTA}B (<=1%)"

      - name: "Fidelity gate: rebuilt AND committed cores land the gate WRAM CRC"
        run: |
          set -euo pipefail
          check() { # $1 = dir to serve (needs index.html/app.js/cores/roms)
            python3 -m http.server 8000 --directory "$1" >/dev/null 2>&1 &
            SRV=$!
            sleep 1
            DOM=$(google-chrome --headless=new --disable-gpu --no-sandbox \
              --virtual-time-budget=120000 --dump-dom \
              "http://localhost:8000/?rom=mandel-display&verify=1" 2>/dev/null)
            kill $SRV
            echo "$DOM" | grep -o 'id="checkresult"[^<]*<\?[^<]*' | head -1
            echo "$DOM" | grep -q 'badge pass' || { echo "fidelity self-check did not PASS for $1"; exit 1; }
          }
          # 1. the freshly rebuilt core (web/ as-is)
          check web
          # 2. the committed dist engine, staged into the same harness
          rm -rf /tmp/dist-harness && cp -r web /tmp/dist-harness
          cp dist/engine/app.js /tmp/dist-harness/app.js
          cp dist/engine/cores/* /tmp/dist-harness/cores/
          check /tmp/dist-harness

      - name: "Sync CLI smoke: sync --demo, then --check, then tamper must fail"
        run: |
          set -euo pipefail
          node bin/sync.mjs sync /tmp/smoke --demo
          node bin/sync.mjs sync --check /tmp/smoke
          echo tamper >> /tmp/smoke/app.js
          if node bin/sync.mjs sync --check /tmp/smoke; then
            echo "tampered engine passed --check"; exit 1
          fi
          echo "sync CLI OK (drift correctly detected)"

      - name: npm pack sanity
        run: npm pack --dry-run
